<div class="filters">
  <p-select
    [options]="subjects()"
    optionLabel="label"
    optionValue="id"
    [ngModel]="subjectAreaId()"
    (ngModelChange)="subjectAreaId.set($event)"
    [filter]="true"
    filterBy="label"
    [showClear]="true"
    appendTo="body"
    placeholder="Select a subject area"
    [disabled]="loadingSubjects()"
  />
  <input
    pInputText
    type="text"
    placeholder="Course number (optional)"
    [ngModel]="courseNbr()"
    (ngModelChange)="courseNbr.set($event)"
    (keyup.enter)="search()"
  />
  <p-button
    label="Search"
    icon="pi pi-search"
    (onClick)="search()"
    [disabled]="subjectAreaId() == null || searching()"
    [loading]="searching()"
  />
</div>

@if (error()) {
  <p-message severity="error" [text]="error()!" />
}

@if (loadingSubjects() || searching()) {
  <div class="center"><p-progressSpinner strokeWidth="4" /></div>
} @else if (searched() && result(); as d) {
  <p-table
    [value]="rows()"
    [paginator]="rows().length > 25"
    [rows]="25"
    [rowsPerPageOptions]="[25, 50, 100]"
    styleClass="p-datatable-sm p-datatable-striped"
  >
    <ng-template pTemplate="caption">
      <div class="tbl-caption">
        <span>{{ rows().length }} class(es)</span>
        <span class="spacer"></span>
        <p-button label="CSV" icon="pi pi-download" severity="secondary" [text]="true" (onClick)="exportCsv()" [disabled]="!rows().length" />
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        @for (col of columns(); track $index) {
          <th>{{ col }}</th>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        @for (col of columns(); track $index) {
          <td>{{ row.cells?.[$index] ?? '' }}</td>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns().length || 1">No classes found.</td>
      </tr>
    </ng-template>
  </p-table>
}
