@if (loading()) {
  <div class="center"><p-progressSpinner strokeWidth="4" /></div>
} @else if (error()) {
  <p-message severity="error" [text]="error()!" />
  <div class="mt"><p-button label="Retry" icon="pi pi-refresh" (onClick)="load()" /></div>
} @else {
  <div class="offering-search">
    @for (m of messages(); track m) {
      <p-message severity="info" [text]="m" />
    }

    @if (models().length) {
      <div class="search-bar">
        <p-select
          [options]="modelOptions()"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="modelIndex"
          [filter]="true"
          filterBy="label"
          appendTo="body"
          styleClass="sa-select"
        />
        <span class="hint">{{ models().length }} grid(s)</span>
      </div>

      @if (selected(); as model) {
        <app-solver-grid-view [model]="model" />
      }
    } @else {
      <p-message severity="info" text="No timetable grids (no solution loaded, or nothing matches the filter)." />
    }
  </div>
}
