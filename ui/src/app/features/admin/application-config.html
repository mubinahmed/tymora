@if (loading()) {
  <div class="center"><p-progressSpinner strokeWidth="4" /></div>
} @else if (error()) {
  <p-message severity="error" [text]="error()!" />
  <div class="mt"><p-button label="Retry" icon="pi pi-refresh" (onClick)="load()" /></div>
} @else {
  <p-table
    [value]="rows()"
    [paginator]="rows().length > 25"
    [rows]="25"
    [rowsPerPageOptions]="[25, 50, 100]"
    styleClass="p-datatable-sm p-datatable-striped"
  >
    <ng-template pTemplate="caption">
      <div class="tbl-caption">
        <span>{{ rows().length }} setting(s)</span>
        <span class="spacer"></span>
        <input
          pInputText
          type="text"
          placeholder="Filter…"
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
        />
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>Key</th>
        <th>Value</th>
        <th>Description</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.key ?? '' }}</td>
        <td>{{ row.value ?? '' }}</td>
        <td>{{ row.description ?? '' }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">No application configuration settings found.</td>
      </tr>
    </ng-template>
  </p-table>
}
