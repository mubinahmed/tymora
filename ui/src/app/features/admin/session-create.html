@if (loading()) {
  <div class="center"><p-progressSpinner strokeWidth="4" /></div>
} @else if (error()) {
  <p-message severity="error" [text]="error()!" />
  <div class="mt">
    <p-button label="Back to Academic Sessions" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
  </div>
} @else {
  <p-card header="Add Academic Session">
    <div class="building-form">
      <div class="field">
        <label>Academic Initiative *</label>
        <input pInputText [disabled]="!canAdd()"
          [ngModel]="model().academicInitiative"
          (ngModelChange)="set('academicInitiative', $event)" />
      </div>

      <div class="field">
        <label>Academic Year *</label>
        <input pInputText [disabled]="!canAdd()"
          [ngModel]="model().academicYear"
          (ngModelChange)="set('academicYear', $event)" />
      </div>

      <div class="field">
        <label>Academic Term *</label>
        <input pInputText [disabled]="!canAdd()"
          [ngModel]="model().academicTerm"
          (ngModelChange)="set('academicTerm', $event)" />
      </div>

      <div class="field">
        <label>Session Start Date *</label>
        <input pInputText [disabled]="!canAdd()"
          [placeholder]="dateFormat()"
          [ngModel]="model().sessionBeginDateTime"
          (ngModelChange)="set('sessionBeginDateTime', $event)" />
      </div>

      <div class="field">
        <label>Classes End Date *</label>
        <input pInputText [disabled]="!canAdd()"
          [placeholder]="dateFormat()"
          [ngModel]="model().classesEndDateTime"
          (ngModelChange)="set('classesEndDateTime', $event)" />
      </div>

      <div class="field">
        <label>Session End Date *</label>
        <input pInputText [disabled]="!canAdd()"
          [placeholder]="dateFormat()"
          [ngModel]="model().sessionEndDateTime"
          (ngModelChange)="set('sessionEndDateTime', $event)" />
      </div>

      <div class="field">
        <label>Examination Start Date *</label>
        <input pInputText [disabled]="!canAdd()"
          [placeholder]="dateFormat()"
          [ngModel]="model().examBeginDate"
          (ngModelChange)="set('examBeginDate', $event)" />
      </div>

      <div class="field">
        <label>Event Start Date *</label>
        <input pInputText [disabled]="!canAdd()"
          [placeholder]="dateFormat()"
          [ngModel]="model().eventBeginDate"
          (ngModelChange)="set('eventBeginDate', $event)" />
      </div>

      <div class="field">
        <label>Event End Date *</label>
        <input pInputText [disabled]="!canAdd()"
          [placeholder]="dateFormat()"
          [ngModel]="model().eventEndDate"
          (ngModelChange)="set('eventEndDate', $event)" />
      </div>

      <div class="field">
        <label>Academic Session Status *</label>
        <p-select
          [options]="statuses()"
          optionLabel="label"
          optionValue="id"
          [disabled]="!canAdd()"
          appendTo="body"
          placeholder="Select a status"
          [ngModel]="model().statusTypeId"
          (ngModelChange)="set('statusTypeId', $event)"
        />
      </div>
    </div>

    <p-message severity="info"
      text="Only the mandatory descriptive fields above are set on create. Enrollment week boundaries default to 1 / 1 / 4. Optional setup — default date pattern, holidays, notifications, sectioning status, class duration type, instructional method and roll-forward — is configured afterwards on the edit / legacy pages." />

    <ng-template pTemplate="footer">
      <div class="tbl-caption">
        <p-button label="Back" icon="pi pi-arrow-left" severity="secondary" [text]="true" (onClick)="back()" [disabled]="saving()" />
        <span class="spacer"></span>
        @if (canAdd()) {
          <p-button label="Create" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
        }
      </div>
    </ng-template>
  </p-card>
}
