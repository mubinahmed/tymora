@if (loading()) {
  <div class="center"><p-progressSpinner strokeWidth="4" /></div>
} @else if (error()) {
  <p-message severity="error" [text]="error()!" />
  <div class="mt"><p-button label="Retry" icon="pi pi-refresh" (onClick)="reload()" /></div>
} @else {
  <div class="offering-search">
    <div class="search-bar">
      <span>Signed in as <strong>{{ currentName() }}</strong></span>
      @if (masquerading()) {
        <p-tag value="Masquerading" severity="warn" />
        <span class="spacer"></span>
        <p-button label="Stop masquerading" icon="pi pi-sign-out" severity="secondary" (onClick)="stopMasquerade()" />
      }
    </div>

    <p-table
      #dt
      [value]="users()"
      [paginator]="users().length > 25"
      [rows]="25"
      [globalFilterFields]="['name', 'puid']"
      sortField="name"
      [sortOrder]="1"
      dataKey="puid"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template pTemplate="caption">
        <div class="tbl-caption">
          <span>{{ users().length }} user(s)</span>
          <span class="spacer"></span>
          <input pInputText type="text" placeholder="Search…"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th pSortableColumn="puid">External Id <p-sortIcon field="puid" /></th>
          <th class="col-actions"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-u>
        <tr>
          <td>{{ u.name }}</td>
          <td>{{ u.puid }}</td>
          <td class="row-actions">
            <p-button label="Masquerade" icon="pi pi-user" [text]="true" (onClick)="masqueradeAs(u)" />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr><td colspan="3">No users available.</td></tr>
      </ng-template>
    </p-table>
  </div>

  <p-confirmDialog />
}
