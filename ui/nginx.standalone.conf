# Standalone nginx config for a UI container that is NOT on the compose network
# with the backend. Serves the Angular SPA (with client-routing fallback) and
# reverse-proxies backend paths to the UniTime backend.
#
# Proxy target: the backend published on the host at :8888. On Docker Desktop
# host.docker.internal resolves automatically; on plain Linux run the container
# with:  --add-host=host.docker.internal:host-gateway
# (If this container shares a network with the backend container instead, change
#  the upstream to  server unitime-web:8080; )

upstream unitime_backend {
    server unitime-web:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/     { proxy_pass http://unitime_backend; }
    location /login    { proxy_pass http://unitime_backend; }
    location /unitime/ { proxy_pass http://unitime_backend; }

    # All legacy backend pages (Struts/GWT host) -> backend. This covers the
    # coexistence surface: chameleon.action, selectPrimaryRole.action, every
    # legacy menu target (*.action / *.do), and GWT host pages (*.jsp).
    location ~ \.(action|do|jsp)$ { proxy_pass http://unitime_backend; }

    # Everything else is the Angular SPA (client-side routing fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    proxy_set_header Host              $http_host;  # keep the port so backend redirects stay on :8000
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
