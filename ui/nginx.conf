# Serves the Angular SPA and reverse-proxies backend paths to unitime-web so the
# browser stays on one origin (session cookie shared with the facade).
# The upstream host must match the compose service name (unitime-web:8080).

upstream unitime_backend {
    server unitime-web:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Facade + classic services + legacy auth/GWT paths -> backend.
    location /api/            { proxy_pass http://unitime_backend; }
    location /login          { proxy_pass http://unitime_backend; }
    location /login.action   { proxy_pass http://unitime_backend; }
    location /logout.action  { proxy_pass http://unitime_backend; }
    location /selectPrimaryRole.action { proxy_pass http://unitime_backend; }
    location /gwt.jsp        { proxy_pass http://unitime_backend; }
    location /unitime/       { proxy_pass http://unitime_backend; }

    # SPA: everything else falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Preserve headers/cookies for proxied requests.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
