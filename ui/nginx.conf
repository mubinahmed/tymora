# Serves the Angular SPA and reverse-proxies backend paths to unitime-web so the
# browser stays on one origin (session cookie shared with the facade).
# The upstream host must match the compose service name (unitime-web:8080).

upstream unitime_backend {
    server unitime-web:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Facade + classic services -> backend.
    location /api/     { proxy_pass http://unitime_backend; }
    location /login    { proxy_pass http://unitime_backend; }
    location /unitime/ { proxy_pass http://unitime_backend; }
    # Room picture upload (multipart) + image serving servlets.
    location /upload   { proxy_pass http://unitime_backend; }
    location /picture  { proxy_pass http://unitime_backend; }
    location /export   { proxy_pass http://unitime_backend; }

    # All legacy backend pages (chameleon/selectPrimaryRole/menu targets *.action,
    # *.do, and GWT host *.jsp) -> backend, for strangler coexistence.
    location ~ \.(action|do|jsp)$ { proxy_pass http://unitime_backend; }

    # SPA: everything else falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Preserve headers/cookies for proxied requests.
    proxy_set_header Host              $http_host;  # keep the port so backend redirects stay on :8000
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
